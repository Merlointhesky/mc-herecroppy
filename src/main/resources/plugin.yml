name: HereCroppy
version: '1.1.1'
main: com.herecroppy.herecroppy.HereCroppyPlugin
description: Auto-farming plugin for Paper servers with advanced configuration
api-version: '1.21'
author: HereCroppy
softdepend: [AuraSkills]

commands:
  herecroppy:
    description: Main command for HereCroppy auto-farming
    usage: /herecroppy <start|stop|restart|clear|setup|config>
    permission: herecroppy.use

permissions:
  herecroppy.use:
    description: Allows use of the herecroppy command
    default: true
  herecroppy.setup:
    description: Allows use of the setup wizard
    default: true
  herecroppy.config:
    description: Allows use of the crop configuration UI
    default: true
